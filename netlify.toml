[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/produit/*"
  to = "/.netlify/functions/product/:splat"
  status = 200

[[redirects]]
  from = "/apercu.jpg"
  to = "/.netlify/functions/og-image"
  status = 200

# Le logo change rarement : les navigateurs peuvent le garder une semaine.
[[headers]]
  for = "/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
